baseURL: "https://zhuoqidev.com/"
title: "ZhuoQi Dev"
paginate: 10
theme: PaperMod
copyright: "© 2026 Liu ZhuoQi"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

defaultContentLanguage: zh
defaultContentLanguageInSubdir: false

languages:
  zh:
    languageName: "中文"
    label: "中文"
    weight: 1
    title: "卓琪的开发笔记"
    params:
      profileMode:
        enabled: true
        title: "刘卓琪"
        subtitle: "AI Agent 开发者 · 把 AI 能力落到实际产品里"
        imageUrl: "/images/avatar.jpg"
        imageAltText: "Liu ZhuoQi"
        buttons:
          - name: "文章"
            url: "/posts"
          - name: "作品"
            url: "/projects"
      homeInfoParams:
        Title: "你好，我是卓琪"
        Content: "AI Agent 开发者，做智能系统、数据可视化和自动化工作流。如果你有 AI Agent 集成开发的需求，欢迎联系我。"
    menu:
      main:
        - identifier: posts
          name: "文章"
          url: /posts/
          weight: 10
        - identifier: projects
          name: "作品"
          url: /projects/
          weight: 20
        - identifier: tags
          name: "标签"
          url: /tags/
          weight: 30
        - identifier: about
          name: "关于"
          url: /about/
          weight: 40
        - identifier: search
          name: "搜索"
          url: /search/
          weight: 50

  en:
    languageName: "English"
    label: "English"
    weight: 2
    title: "ZhuoQi Dev"
    params:
      profileMode:
        enabled: true
        title: "Liu ZhuoQi"
        subtitle: "AI Agent Developer · Integrating AI into real products"
        imageUrl: "/images/avatar.jpg"
        imageAltText: "Liu ZhuoQi"
        buttons:
          - name: "Posts"
            url: "/en/posts"
          - name: "Projects"
            url: "/en/projects"
      homeInfoParams:
        Title: "Hi, I'm ZhuoQi"
        Content: "AI Agent developer building intelligent systems, data visualization, and automated workflows. If you need an AI Agent integration developer, reach out."
    menu:
      main:
        - identifier: posts
          name: "Posts"
          url: /en/posts/
          weight: 10
        - identifier: projects
          name: "Projects"
          url: /en/projects/
          weight: 20
        - identifier: tags
          name: "Tags"
          url: /en/tags/
          weight: 30
        - identifier: about
          name: "About"
          url: /en/about/
          weight: 40
        - identifier: search
          name: "Search"
          url: /en/search/
          weight: 50

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production
  author: "Liu ZhuoQi"
  description: "AI Agent 开发者刘卓琪的个人博客，分享 AI Agent 开发、工具工程和创意编程。"
  keywords: [AI Agent, LangChain, Cursor, 个人博客, 开发笔记]

  defaultTheme: auto
  disableThemeToggle: false
  ShowShareButtons: true
  ShowReadingTime: true
  displayFullLangName: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowToc: true
  comments: false

  profileMode:
    enabled: true

  socialIcons:
    - name: github
      url: "https://github.com/YouToco"
    - name: x
      url: "https://x.com/zhuoqidev"
    - name: rss
      url: "/index.xml"

  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false

  editPost:
    URL: "https://github.com/YouToco/zhuoqidev.com/blob/main/content"
    Text: "编辑此页"
    appendFilePath: true

  # Analytics — fill in after setup
  # umamiWebsiteId: "your-umami-website-id"
  # umamiScriptSrc: "https://cloud.umami.is/script.js"
  # baiduAnalyticsId: "your-baidu-hm-id"
  # cloudflareAnalyticsToken: "your-cf-token"

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10
    keys: ["title", "permalink", "summary", "content"]

taxonomies:
  category: categories
  tag: tags
  series: series

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    anchorLineNos: true
    codeFences: true
    guessSyntax: true
    lineNos: true
    style: monokai
