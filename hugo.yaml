baseURL: "https://zhuoqidev.com/"
title: "ZhuoQi Dev"
theme: blowfish
paginate: 10
copyright: "© 2026 Liu ZhuoQi"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

defaultContentLanguage: zh
defaultContentLanguageInSubdir: false

languages:
  zh:
    label: "中文"
    locale: zh-CN
    weight: 1
    title: "卓琪的开发笔记"
    params:
      displayName: "中文"
      isoCode: zh-CN
      rtl: false
      dateFormat: "2006-01-02"
    menu:
      main:
        - identifier: posts
          name: "文章"
          url: /posts/
          weight: 10
        - identifier: projects
          name: "作品"
          url: /projects/
          weight: 20
        - identifier: tags
          name: "标签"
          url: /tags/
          weight: 30
        - identifier: about
          name: "关于"
          url: /about/
          weight: 40
        - identifier: search
          name: "搜索"
          url: /search/
          weight: 50

  en:
    label: "English"
    locale: en
    weight: 2
    title: "ZhuoQi Dev"
    params:
      displayName: "EN"
      isoCode: en
      rtl: false
      dateFormat: "2006-01-02"
    menu:
      main:
        - identifier: posts
          name: "Posts"
          url: /en/posts/
          weight: 10
        - identifier: projects
          name: "Projects"
          url: /en/projects/
          weight: 20
        - identifier: tags
          name: "Tags"
          url: /en/tags/
          weight: 30
        - identifier: about
          name: "About"
          url: /en/about/
          weight: 40
        - identifier: search
          name: "Search"
          url: /en/search/
          weight: 50

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  author:
    name: "Liu ZhuoQi"
    image: "avatar.jpg"
    headline: "AI Agent 开发者 · 把 AI 能力落到实际产品里"
    bio: "AI Agent 开发者刘卓琪的个人博客，分享 AI Agent 开发、工具工程和创意编程。"
    links:
      - github: "https://github.com/YouToco"
      - x-twitter: "https://x.com/zhuoqidev"
      - rss: "/index.xml"

  description: "AI Agent 开发者刘卓琪的个人博客，分享 AI Agent 开发、工具工程和创意编程。"
  keywords: [AI Agent, LangChain, Cursor, 个人博客, 开发笔记]

  defaultTheme: auto
  disableThemeToggle: false

  # Homepage
  homepage:
    layout: profile
    showRecent: false

  # Article display
  article:
    showDate: true
    showDateUpdated: true
    showReadingTime: true
    showWordCount: true
    showTableOfContents: true
    showTaxonomies: true
    showAuthors: true
    showZenMode: false
    showRelatedContent: true
    relatedContentLimit: 3
    showCopyButton: true
    showBreadcrumbs: true
    showPagination: true
    sharingLinks:
      - x-twitter
      - linkedin
      - reddit
      - facebook
      - whatsapp
      - telegram
      - hackernews

  # Edit link
  editPost:
    URL: "https://github.com/YouToco/zhuoqidev.com/blob/main/content"
    Text: "编辑此页"
    appendFilePath: true

  # Header layout
  header:
    layout: fixed

  # Enable search
  enableSearch: true

  # Footer
  footer:
    showCopyright: true
    showThemeAttribution: true
    showAppearanceSwitcher: false

  # Fuse.js search
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10
    keys: ["title", "permalink", "summary", "content"]

taxonomies:
  category: categories
  tag: tags
  series: series

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    anchorLineNos: true
    codeFences: true
    guessSyntax: true
    lineNos: true
    style: monokai
