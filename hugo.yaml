baseURL: "https://zhuoqidev.com/"
title: "ZhuoQi Dev"
theme: blowfish
paginate: 10
copyright: "© 2026 Liu ZhuoQi"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

defaultContentLanguage: zh
defaultContentLanguageInSubdir: false

languages:
  zh:
    label: "中文"
    languageCode: zh-CN
    weight: 1
    title: "卓琪的开发笔记"
    params:
      displayName: "中文"
      isoCode: zh-CN
      rtl: false
      dateFormat: "2006-01-02"

  en:
    label: "English"
    languageCode: en
    weight: 2
    title: "ZhuoQi Dev"
    params:
      displayName: "EN"
      isoCode: en
      rtl: false
      dateFormat: "2006-01-02"
      author:
        name: "Liu ZhuoQi"
        image: "avatar.jpg"
        headline: "AI Agent Developer · Integrating AI into real products"
        bio: "Personal blog of AI Agent developer Liu ZhuoQi. Sharing practical notes on AI Agent development, tool engineering, and creative programming."
        links:
          - github: "https://github.com/YouToco"
          - x-twitter: "https://x.com/zhuoqidev"
          - rss: "/index.xml"
      description: "Personal blog of AI Agent developer Liu ZhuoQi. Sharing practical notes on AI Agent development."
      keywords: [AI Agent, LLM, LangChain, Cursor, dev blog]

menu:
  main:
    - name: "文章"
      url: /posts/
      weight: 10
    - name: "作品"
      url: /projects/
      weight: 20
    - name: "标签"
      url: /tags/
      weight: 30
    - name: "关于"
      url: /about/
      weight: 40
    - name: "Posts"
      url: /en/posts/
      weight: 110
    - name: "Projects"
      url: /en/projects/
      weight: 120
    - name: "Tags"
      url: /en/tags/
      weight: 130
    - name: "About"
      url: /en/about/
      weight: 140

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  # Blowfish 内置动画背景 SVG（与 blowfish.page 同款）
  defaultBackgroundImage: "img/background.svg"

  author:
    name: "Liu ZhuoQi"
    image: "avatar.jpg"
    headline: "AI Agent 开发者 · 把 AI 能力落到实际产品里"
    bio: "AI Agent 开发者刘卓琪的个人博客，分享 AI Agent 开发、工具工程和创意编程。"
    links:
      - github: "https://github.com/YouToco"
      - x-twitter: "https://x.com/zhuoqidev"
      - rss: "/index.xml"

  description: "AI Agent 开发者刘卓琪的个人博客，分享 AI Agent 开发、工具工程和创意编程。"
  keywords: [AI Agent, LangChain, Cursor, 个人博客, 开发笔记]

  # Blowfish 默认外观
  colorScheme: "blowfish"
  defaultAppearance: "light"
  autoSwitchAppearance: true

  # Blowfish 默认功能
  enableSearch: true
  enableCodeCopy: true
  enableA11y: true
  enableImageOptimization: true
  fingerprintAlgorithm: "sha512"

  # Homepage — Profile layout with recent posts
  homepage:
    layout: profile
    showRecent: true
    showRecentItems: 3
    layoutBackgroundBlur: true

  # Article display
  article:
    showDate: true
    showDateUpdated: true
    showReadingTime: true
    showWordCount: true
    showTableOfContents: true
    showTaxonomies: true
    showAuthors: true
    showRelatedContent: true
    relatedContentLimit: 3
    showBreadcrumbs: true
    showPagination: true
    showHeadingAnchors: true
    showZenMode: false
    sharingLinks:
      - x-twitter
      - linkedin
      - reddit
      - facebook
      - whatsapp
      - telegram
      - hackernews

  # Section list pages
  list:
    showBreadcrumbs: true
    showSummary: true
    showCards: true
    groupByYear: true
    cardView: true

  # Edit link
  editPost:
    URL: "https://github.com/YouToco/zhuoqidev.com/blob/main/content"
    Text: "编辑此页"
    appendFilePath: true

  # Blowfish 默认 Header — 毛玻璃固定导航
  header:
    layout: fixed-fill-blur

  # Blowfish 默认 Footer
  footer:
    showCopyright: true
    showThemeAttribution: false
    showAppearanceSwitcher: true
    showScrollToTop: true

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10
    keys: ["title", "permalink", "summary", "content"]

taxonomies:
  category: categories
  tag: tags
  series: series

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    anchorLineNos: true
    codeFences: true
    guessSyntax: true
    lineNos: true
    style: monokai
