baseURL: "https://zhuoqidev.com/"
title: "ZhuoQi Dev"
theme: blowfish
paginate: 10
copyright: "© 2026 Liu ZhuoQi"

services:
  googleAnalytics:
    id: "G-8T5T6HPCBC"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

defaultContentLanguage: zh
defaultContentLanguageInSubdir: false

languages:
  zh:
    label: "中文"
    locale: zh-CN
    weight: 1
    title: "卓琪的开发笔记"
    params:
      displayName: "中文"
      isoCode: zh-CN
      rtl: false
      dateFormat: "2006-01-02"
      description: "AI Agent 架构师刘卓琪的技术博客。记忆层架构、多 Agent 编排、上下文工程、RAG 管道、推理优化与 AI 安全的深度实战与调研。"
      keywords: [AI Agent, Agent 架构师, 记忆层, 多 Agent 编排, 上下文工程, RAG, 推理优化, LLM]
      author:
        name: "Liu ZhuoQi"
        image: "avatar.jpg"
        headline: "AI Agent 架构师 · 从模型到生产，一个人走通"
        bio: "AI Agent 架构师。从零设计 Agent 系统：记忆层、多 Agent 编排、上下文工程、RAG 管道与工具调用安全——CKS 认证，模型到生产一个人走通。"
        links:
          - github: "https://github.com/YouToco"
          - x-twitter: "https://x.com/busygod9527"
          - telegram: "https://t.me/happyforyou0"
          - wechat: "/images/wechat.jpg"
          - rss: "/index.xml"

  en:
    label: "English"
    locale: en
    weight: 2
    title: "ZhuoQi Dev"
    params:
      displayName: "EN"
      isoCode: en
      rtl: false
      dateFormat: "2006-01-02"
      author:
        name: "Liu ZhuoQi"
        image: "avatar.jpg"
        headline: "AI Agent Architect · From Model to Production, Solo"
        bio: "AI Agent Architect. Designing Agent systems from the ground up: memory layers, multi-agent orchestration, context engineering, RAG, and tool-use security — CKS certified, taking models to production solo."
        links:
          - github: "https://github.com/YouToco"
          - x-twitter: "https://x.com/busygod9527"
          - telegram: "https://t.me/happyforyou0"
          - wechat: "/images/wechat.jpg"
          - rss: "/index.xml"
      description: "Liu ZhuoQi — AI Agent Architect. Deep dives on memory layers, multi-agent orchestration, context engineering, RAG, inference optimization, and AI security."
      keywords: [AI Agent, OpenClaw, Agent Architecture, Prompt Engineering, dev blog]

menu:
  main:
    - name: "文章"
      url: /posts/
      weight: 10
    - name: "标签"
      url: /tags/
      weight: 30
    - name: "关于"
      url: /about/
      weight: 40
    - name: "Posts"
      url: /en/posts/
      weight: 110
    - name: "Tags"
      url: /en/tags/
      weight: 130
    - name: "About"
      url: /en/about/
      weight: 140

outputs:
  home:
    - HTML
    - RSS
    - JSON

mainSections:
  - posts

params:
  # Blowfish 内置动画背景 SVG（与 blowfish.page 同款）
  defaultBackgroundImage: "img/background.svg"

  author:
    name: "Liu ZhuoQi"
    image: "avatar.jpg"
    headline: "AI Agent 开发者 · 从 Prompt 到产品落地"
    bio: "把 AI Agent 做进真实产品里。写代码，也写思考。记录 AI Agent 开发、工具工程与产品落地的实战笔记。"
    links:
    - github: "https://github.com/YouToco"
    - x-twitter: "https://x.com/busygod9527"
    - telegram: "https://t.me/happyforyou0"
    - wechat: "/images/wechat.jpg"
    - rss: "/index.xml"

  description: "AI Agent 架构师刘卓琪的技术博客。记忆层架构、多 Agent 编排、上下文工程、RAG 管道、推理优化与 AI 安全的深度实战与调研。"
  keywords: [AI Agent, Agent 架构师, 记忆层, 多 Agent 编排, 上下文工程, RAG, 推理优化, LLM]
  icp: "湘ICP备2026017384号"
  gongan: "湘公网安备43090302000353号"
  gonganCode: "43090302000353"
  defaultSocialImage: "img/og-default.png"
  twitter: "busygod9527"

  # Blowfish 默认外观
  colorScheme: "blowfish"
  defaultAppearance: "light"
  autoSwitchAppearance: true

  # Blowfish 默认功能
  enableSearch: true
  enableCodeCopy: true
  enableA11y: true
  enableStructuredBreadcrumbs: true
  disableImageOptimization: false
  fingerprintAlgorithm: "sha512"

  # Homepage — Profile layout with recent posts
  homepage:
    layout: background
    showRecent: true
    showRecentItems: 5
    layoutBackgroundBlur: true

  # Article display
  article:
    showHero: true
    heroStyle: "background"
    showDate: true
    showDateUpdated: true
    showReadingTime: true
    showWordCount: true
    showTableOfContents: true
    showTaxonomies: true
    showAuthors: true
    showRelatedContent: true
    relatedContentLimit: 3
    showBreadcrumbs: true
    showPagination: true
    showHeadingAnchors: true
    showZenMode: true
    showAuthorBottom: true
    seriesOpened: true
    sharingLinks:
      - x-twitter
      - linkedin
      - reddit
      - facebook
      - whatsapp
      - telegram
      - hackernews

  # Section list pages
  list:
    showHero: true
    heroStyle: "background"
    showBreadcrumbs: true
    showSummary: true
    showCards: true
    groupByYear: true
    cardView: true

  # Edit link
  editPost:
    URL: "https://github.com/YouToco/zhuoqidev.com/blob/main/content"
    Text: "编辑此页"
    appendFilePath: true

  # Blowfish 默认 Header — 毛玻璃固定导航
  header:
    layout: fixed-fill-blur

  # Blowfish 默认 Footer
  footer:
    showMenu: true
    showCopyright: true
    showThemeAttribution: false
    showAppearanceSwitcher: true
    showScrollToTop: true

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10
    keys: ["title", "permalink", "summary", "content"]

taxonomies:
  category: categories
  tag: tags
  series: series

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    anchorLineNos: true
    codeFences: true
    guessSyntax: true
    lineNos: true
    style: monokai
