baseURL: "https://zhuoqidev.com/"
title: "ZhuoQi Dev"
theme: blowfish
paginate: 10
copyright: "© 2026 Liu ZhuoQi"

services:
  googleAnalytics:
    id: "G-8T5T6HPCBC"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

defaultContentLanguage: zh
defaultContentLanguageInSubdir: false

languages:
  zh:
    label: "中文"
    locale: zh-CN
    weight: 1
    title: "卓琪的开发笔记"
    params:
      displayName: "中文"
      isoCode: zh-CN
      rtl: false
      dateFormat: "2006-01-02"
      description: "AI 应用开发工程师刘卓琪的技术博客。记录 Agent 产品开发、后端工程、上下文工程、RAG、工具调用与 AI 安全的实战与调研。"
      keywords: [AI 应用开发, AI Agent, Agent 工程, Go, Python, Temporal, RAG, LLM]
      author:
        name: "Liu ZhuoQi"
        image: "avatar.jpg"
        headline: "AI 应用开发工程师（Agent 方向）"
        bio: "AI 应用开发工程师（Agent 方向）。使用 Go、Python 与 React 将 Agent 能力做进真实产品，记录从开发、测试到生产交付的实践。"
        links:
          - github: "https://github.com/YouToco"
          - x-twitter: "https://x.com/busygod9527"
          - telegram: "https://t.me/happyforyou0"
          - wechat: "/images/wechat.jpg"
          - rss: "/index.xml"

  en:
    label: "English"
    locale: en
    weight: 2
    title: "ZhuoQi Dev"
    params:
      displayName: "EN"
      isoCode: en
      rtl: false
      dateFormat: "2006-01-02"
      author:
        name: "Liu ZhuoQi"
        image: "avatar.jpg"
        headline: "AI Application Engineer · Agent Systems"
        bio: "AI application engineer focused on Agent systems. Building production products with Go, Python, and React, from implementation and testing through deployment."
        links:
          - github: "https://github.com/YouToco"
          - x-twitter: "https://x.com/busygod9527"
          - telegram: "https://t.me/happyforyou0"
          - wechat: "/images/wechat.jpg"
          - rss: "/index.xml"
      description: "Liu ZhuoQi — AI application engineer focused on production Agent systems, backend engineering, context engineering, RAG, tool use, and AI security."
      keywords: [AI Application Engineering, AI Agent, Go, Python, Temporal, RAG, LLM]

menu:
  main:
    - name: "文章"
      url: /posts/
      weight: 10
    - name: "作品"
      url: /projects/
      weight: 20
    - name: "标签"
      url: /tags/
      weight: 30
    - name: "关于"
      url: /about/
      weight: 40
    - name: "Posts"
      url: /en/posts/
      weight: 110
    - name: "Projects"
      url: /en/projects/
      weight: 120
    - name: "Tags"
      url: /en/tags/
      weight: 130
    - name: "About"
      url: /en/about/
      weight: 140

outputs:
  home:
    - HTML
    - RSS
    - JSON
    - LLMS

outputFormats:
  LLMS:
    mediaType: "text/plain"
    baseName: "llms"
    isPlainText: true
    notAlternative: true

mainSections:
  - posts

params:
  # Blowfish 内置动画背景 SVG（与 blowfish.page 同款）
  defaultBackgroundImage: "img/background.svg"

  author:
    name: "Liu ZhuoQi"
    image: "avatar.jpg"
    headline: "AI 应用开发工程师（Agent 方向）"
    bio: "使用 Go、Python 与 React 将 Agent 能力做进真实产品，记录从开发、测试到生产交付的实践。"
    links:
    - github: "https://github.com/YouToco"
    - x-twitter: "https://x.com/busygod9527"
    - telegram: "https://t.me/happyforyou0"
    - wechat: "/images/wechat.jpg"
    - rss: "/index.xml"

  description: "AI 应用开发工程师刘卓琪的技术博客。记录 Agent 产品开发、后端工程、上下文工程、RAG、工具调用与 AI 安全的实战与调研。"
  keywords: [AI 应用开发, AI Agent, Agent 工程, Go, Python, Temporal, RAG, LLM]
  icp: "湘ICP备2026017384号"
  gongan: "湘公网安备43090302000353号"
  gonganCode: "43090302000353"
  defaultSocialImage: "img/og-default.png"
  twitter: "busygod9527"

  # Blowfish 默认外观
  colorScheme: "blowfish"
  defaultAppearance: "light"
  autoSwitchAppearance: true

  # Blowfish 默认功能
  enableSearch: true
  enableCodeCopy: true
  enableA11y: true
  enableStructuredBreadcrumbs: true
  disableImageOptimization: false
  fingerprintAlgorithm: "sha512"

  # Homepage — Profile layout with recent posts
  homepage:
    layout: background
    showRecent: true
    showRecentItems: 5
    layoutBackgroundBlur: true

  # Article display
  article:
    showHero: true
    heroStyle: "background"
    showDate: true
    showDateUpdated: true
    showReadingTime: true
    showWordCount: true
    showTableOfContents: true
    showTaxonomies: true
    showAuthors: true
    showRelatedContent: true
    relatedContentLimit: 3
    showBreadcrumbs: true
    showPagination: true
    showHeadingAnchors: true
    showZenMode: true
    showAuthorBottom: true
    seriesOpened: true
    sharingLinks:
      - x-twitter
      - linkedin
      - reddit
      - facebook
      - whatsapp
      - telegram
      - hackernews

  # Section list pages
  list:
    showHero: true
    heroStyle: "background"
    showBreadcrumbs: true
    showSummary: true
    showCards: true
    groupByYear: true
    cardView: true

  # Edit link
  editPost:
    URL: "https://github.com/YouToco/zhuoqidev.com/blob/main/content"
    Text: "编辑此页"
    appendFilePath: true

  # Blowfish 默认 Header — 毛玻璃固定导航
  header:
    layout: fixed-fill-blur

  # Blowfish 默认 Footer
  footer:
    showMenu: true
    showCopyright: true
    showThemeAttribution: false
    showAppearanceSwitcher: true
    showScrollToTop: true

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10
    keys: ["title", "permalink", "summary", "content"]

taxonomies:
  category: categories
  tag: tags
  series: series

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    anchorLineNos: true
    codeFences: true
    guessSyntax: true
    lineNos: true
    style: monokai
