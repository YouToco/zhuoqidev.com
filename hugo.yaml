baseURL: "https://zhuoqidev.com/"
title: "ZhuoQi Dev"
theme: blowfish
paginate: 10
copyright: "© 2026 Liu ZhuoQi"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

defaultContentLanguage: zh
defaultContentLanguageInSubdir: false

languages:
  zh:
    label: "中文"
    languageCode: zh-CN
    weight: 1
    title: "卓琪的开发笔记"
    params:
      displayName: "中文"
      isoCode: zh-CN
      rtl: false
      dateFormat: "2006-01-02"
      description: "把 AI Agent 做进真实产品里。写代码，也写思考。记录 AI Agent 开发、工具工程与产品落地的实战笔记。"
      keywords: [AI Agent, LangChain, Cursor, 个人博客, 开发笔记]
      author:
        name: "Liu ZhuoQi"
        image: "avatar.jpg"
        headline: "AI Agent 开发者 · 从 Prompt 到产品落地"
        bio: "把 AI Agent 做进真实产品里。写代码，也写思考。记录 AI Agent 开发、工具工程与产品落地的实战笔记。"
        links:
          - github: "https://github.com/YouToco"
          - x-twitter: "https://x.com/busygod9527"
          - telegram: "https://t.me/happyforyou0"
          - wechat: "/images/wechat.jpg"
          - rss: "/index.xml"

  en:
    label: "English"
    languageCode: en
    weight: 2
    title: "ZhuoQi Dev"
    params:
      displayName: "EN"
      isoCode: en
      rtl: false
      dateFormat: "2006-01-02"
      author:
        name: "Liu ZhuoQi"
        image: "avatar.jpg"
        headline: "AI Agent Developer · Building Agents That Ship"
        bio: "Building AI agents that ship. Practical deep dives into AI agent development — from prompt chains to production."
        links:
          - github: "https://github.com/YouToco"
          - x-twitter: "https://x.com/busygod9527"
          - telegram: "https://t.me/happyforyou0"
          - wechat: "/images/wechat.jpg"
          - rss: "/index.xml"
      description: "Building AI agents that ship. Notes on LLM engineering, agent architecture, and tooling."
      keywords: [AI Agent, LLM, LangChain, Cursor, dev blog]

menu:
  main:
    - name: "文章"
      url: /posts/
      weight: 10
    - name: "标签"
      url: /tags/
      weight: 30
    - name: "关于"
      url: /about/
      weight: 40
    - name: "Posts"
      url: /en/posts/
      weight: 110
    - name: "Tags"
      url: /en/tags/
      weight: 130
    - name: "About"
      url: /en/about/
      weight: 140

outputs:
  home:
    - HTML
    - RSS
    - JSON

mainSections:
  - posts

params:
  # Blowfish 内置动画背景 SVG（与 blowfish.page 同款）
  defaultBackgroundImage: "img/background.svg"

  author:
    name: "Liu ZhuoQi"
    image: "avatar.jpg"
    headline: "AI Agent 开发者 · 从 Prompt 到产品落地"
    bio: "把 AI Agent 做进真实产品里。写代码，也写思考。记录 AI Agent 开发、工具工程与产品落地的实战笔记。"
    links:
    - github: "https://github.com/YouToco"
    - x-twitter: "https://x.com/busygod9527"
    - telegram: "https://t.me/happyforyou0"
    - wechat: "/images/wechat.jpg"
    - rss: "/index.xml"

  description: "把 AI Agent 做进真实产品里。写代码，也写思考。记录 AI Agent 开发、工具工程与产品落地的实战笔记。"
  keywords: [AI Agent, LangChain, Cursor, 个人博客, 开发笔记]
  icp: "湘ICP备2026017384号"
  gongan: "湘公网安备43090302000353号"
  gonganCode: "43090302000353"
  defaultSocialImage: "img/og-default.png"
  twitter: "busygod9527"

  # Blowfish 默认外观
  colorScheme: "blowfish"
  defaultAppearance: "light"
  autoSwitchAppearance: true

  # Blowfish 默认功能
  enableSearch: true
  enableCodeCopy: true
  enableA11y: true
  disableImageOptimization: false
  fingerprintAlgorithm: "sha512"

  # Homepage — Profile layout with recent posts
  homepage:
    layout: profile
    showRecent: true
    showRecentItems: 3
    layoutBackgroundBlur: true

  # Article display
  article:
    showDate: true
    showDateUpdated: true
    showReadingTime: true
    showWordCount: true
    showTableOfContents: true
    showTaxonomies: true
    showAuthors: true
    showRelatedContent: true
    relatedContentLimit: 3
    showBreadcrumbs: true
    showPagination: true
    showHeadingAnchors: true
    showZenMode: false
    sharingLinks:
      - x-twitter
      - linkedin
      - reddit
      - facebook
      - whatsapp
      - telegram
      - hackernews

  # Section list pages
  list:
    showBreadcrumbs: true
    showSummary: true
    showCards: true
    groupByYear: true
    cardView: true

  # Edit link
  editPost:
    URL: "https://github.com/YouToco/zhuoqidev.com/blob/main/content"
    Text: "编辑此页"
    appendFilePath: true

  # Blowfish 默认 Header — 毛玻璃固定导航
  header:
    layout: fixed-fill-blur

  # Blowfish 默认 Footer
  footer:
    showCopyright: true
    showThemeAttribution: false
    showAppearanceSwitcher: true
    showScrollToTop: true

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10
    keys: ["title", "permalink", "summary", "content"]

taxonomies:
  category: categories
  tag: tags

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    anchorLineNos: true
    codeFences: true
    guessSyntax: true
    lineNos: true
    style: monokai
