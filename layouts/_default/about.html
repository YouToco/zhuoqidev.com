{{ define "main" }}
  <article class="about-page">
    <header class="about-page__header">
      <p class="about-page__eyebrow">{{ if in .RelPermalink "/en/" }}PROFILE{{ else }}个人介绍{{ end }}</p>
      <h1>{{ .Title | emojify }}</h1>
      {{ with .Params.lead | default .Params.summary }}
        <p class="about-page__summary">{{ . }}</p>
      {{ end }}
    </header>

    <section class="about-content">
      {{ .Content }}
    </section>
  </article>
{{ end }}
