<article class="about-project-card">
  <div class="about-card__topline">
    <span>{{ .Get "role" }}</span>
    <span>{{ .Get "category" }}</span>
  </div>
  <h3>
    {{- with .Get "href" -}}
      <a href="{{ . }}">{{ $.Get "title" }}</a>
    {{- else -}}
      {{ $.Get "title" }}
    {{- end -}}
  </h3>
  {{ .Inner | markdownify }}
  <div class="about-tags">
    {{- range split (.Get "tags") "|" -}}
      <span>{{ . }}</span>
    {{- end -}}
  </div>
</article>
