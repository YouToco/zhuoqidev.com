name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: "0.161.1"
          extended: true

      - name: Verify Blowfish submodule is pinned
        run: |
          test "$(git -C themes/blowfish rev-parse HEAD)" = \
            "4afcd32b9950f16afbd686175b0f49a906d87626"

      - name: Validate shell syntax
        run: bash -n scripts/install-aliyun.sh scripts/renew-cert.sh scripts/deploy-local.sh

      - name: Run tests
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Build Hugo site
        run: hugo --minify --cleanDestinationDir

      - name: Verify build outputs
        run: |
          test -s public/index.html
          test -s public/llms.txt
          test -s public/en/llms.txt
          grep -q "https://zhuoqidev.com/posts/" public/llms.txt
          grep -q "https://zhuoqidev.com/en/posts/" public/en/llms.txt
