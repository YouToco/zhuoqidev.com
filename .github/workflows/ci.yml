name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Mermaid diagrams and social cards are laid out in headless Chrome at build time;
      # the runner image ships Chrome but no CJK fonts, which would shift every Chinese label.
      - name: Install CJK fonts
        run: |
          bash scripts/install-cjk-fonts.sh
          google-chrome --version

      - name: Install dependencies
        run: npm ci

      - name: Validate shell syntax
        run: bash -n scripts/install-aliyun.sh scripts/install-cjk-fonts.sh scripts/renew-cert.sh scripts/deploy-local.sh

      - name: Run repository tests
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Type-check
        run: npm run check

      - name: Unit-test Pages Functions and scripts
        run: npm test

      - name: Build site
        run: npm run build

      - name: Verify build output
        run: npm run verify
