name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs on new pushes
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Hugo Site
    runs-on: ubuntu-latest
    outputs:
      artifact-name: hugo-public
    steps:
      - name: Checkout (with submodules for Blowfish)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: "0.161.1"
          extended: true

      - name: Build
        run: hugo --minify

      - name: Validate llms.txt indexes
        run: |
          test -s public/llms.txt
          test -s public/en/llms.txt
          grep -q "https://zhuoqidev.com/posts/" public/llms.txt
          grep -q "https://zhuoqidev.com/en/posts/" public/en/llms.txt

      - name: Cache public dir
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: public/
          key: hugo-public-${{ github.sha }}

  deploy-cloudflare:
    name: Deploy to Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Restore public dir
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: public/
          key: hugo-public-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.118.0"
          command: pages deploy public/ --project-name=zhuoqidev --commit-dirty=true

  deploy-aliyun-oss:
    name: Deploy to Alibaba Cloud OSS
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Restore public dir
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: public/
          key: hugo-public-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Install ossutil
        env:
          OSSUTIL_VERSION: "2.2.2"
        run: |
          curl -o ossutil.zip "https://gosspublic.alicdn.com/ossutil/v2/${OSSUTIL_VERSION}/ossutil-${OSSUTIL_VERSION}-linux-amd64.zip"
          unzip -q ossutil.zip
          chmod +x "ossutil-${OSSUTIL_VERSION}-linux-amd64/ossutil"
          mv "ossutil-${OSSUTIL_VERSION}-linux-amd64/ossutil" /usr/local/bin/ossutil

      - name: Sync to OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
        run: |
          ossutil sync public/ oss://zhuoqidev/ \
            --endpoint oss-cn-shenzhen.aliyuncs.com \
            --region cn-shenzhen \
            --delete \
            --update

      - name: Refresh CDN Cache
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
        run: |
          pip install aliyun-python-sdk-cdn --quiet
          python3 - <<'EOF'
          import os
          from aliyunsdkcore.client import AcsClient
          from aliyunsdkcdn.request.v20180510.RefreshObjectCachesRequest import RefreshObjectCachesRequest

          client = AcsClient(
            os.environ["ALIYUN_ACCESS_KEY_ID"],
            os.environ["ALIYUN_ACCESS_KEY_SECRET"],
            "cn-hangzhou"
          )
          req = RefreshObjectCachesRequest()
          req.set_ObjectPath("https://zhuoqidev.com/")
          req.set_ObjectType("Directory")
          response = client.do_action_with_exception(req)
          print(response)
          EOF
