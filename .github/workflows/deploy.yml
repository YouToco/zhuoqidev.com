name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize deploys: never run two publishes of the same branch at once.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish (Aliyun OSS + Cloudflare Pages)
    # A manual dispatch from any other branch would publish unreviewed work to production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependency cache here: the publishing job never restores state written by PR runs.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # Mermaid diagrams and social cards are laid out in headless Chrome at build time;
      # the runner image ships Chrome but no CJK fonts, which would shift every Chinese label.
      - name: Install CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk
          google-chrome --version

      - name: Install dependencies
        run: npm ci

      - name: Validate shell syntax
        run: bash -n scripts/install-aliyun.sh scripts/renew-cert.sh scripts/deploy-local.sh

      - name: Run repository tests
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Type-check
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Verify build output
        run: npm run verify

      - name: Write deploy manifest
        run: |
          printf '{"commit":"%s","built_at":"%s"}\n' \
            "${{ github.sha }}" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > dist/deploy-manifest.json

      - name: Install pinned Alibaba Cloud CLI
        run: bash scripts/install-aliyun.sh

      - name: Configure Alibaba Cloud CLI profile
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
        run: |
          "$RUNNER_TEMP/aliyun-3.5.1/aliyun" configure set \
            --profile default \
            --mode AK \
            --access-key-id "$ALIYUN_ACCESS_KEY_ID" \
            --access-key-secret "$ALIYUN_ACCESS_KEY_SECRET" \
            --region cn-shenzhen

      - name: Sync site to Aliyun OSS
        run: |
          "$RUNNER_TEMP/aliyun-3.5.1/aliyun" oss sync dist/ oss://zhuoqidev/ \
            --endpoint oss-cn-shenzhen.aliyuncs.com \
            --region cn-shenzhen \
            --exclude "_headers" \
            --delete \
            --update \
            --force \
            --disable-ignore-error

      # OSS guesses types from the extension but omits the charset (and has no type for .md),
      # so Chinese llms.txt and per-post index.md would render as mojibake in browsers.
      - name: Set text content types on Aliyun OSS
        run: |
          # OSS omits the charset (and has no type for .md), so upload those files again with an
          # explicit type. cp needs only PutObject, the permission sync already uses.
          set_type() {
            "$RUNNER_TEMP/aliyun-3.5.1/aliyun" oss cp dist/ oss://zhuoqidev/ \
              --include "$1" \
              --meta "Content-Type:$2" \
              --endpoint oss-cn-shenzhen.aliyuncs.com \
              --region cn-shenzhen \
              --recursive \
              --force \
              --disable-ignore-error
          }
          set_type "*.md" "text/markdown; charset=utf-8"
          set_type "*.txt" "text/plain; charset=utf-8"
          set_type "*.webmanifest" "application/manifest+json"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.148.0"
          command: pages deploy dist/ --project-name=zhuoqidev --branch main --commit-hash ${{ github.sha }} --commit-dirty=false

      - name: Refresh Aliyun CDN cache
        run: |
          refresh_paths=$(printf '%s/\n%s/\n' "https://zhuoqidev.com" "https://www.zhuoqidev.com")
          result=$("$RUNNER_TEMP/aliyun-3.5.1/aliyun" cdn RefreshObjectCaches \
            --profile default \
            --ObjectPath "$refresh_paths" \
            --ObjectType Directory \
            --Force true)
          task_id=$(printf '%s' "$result" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("RefreshTaskId",""))')
          test -n "$task_id" || {
            echo "Alibaba Cloud returned no CDN refresh task id" >&2
            exit 1
          }
          echo "CDN refresh accepted as task $task_id"

      - name: Verify every provider serves the new commit
        run: |
          commit_sha="${{ github.sha }}"
          primary_edge="zhuoqidev.com.queniuaa.com"
          san_edge="www.zhuoqidev.com.w.kunlunaq.com"
          for attempt in $(seq 1 36); do
            primary=$(curl --fail --silent --show-error \
              --connect-to "zhuoqidev.com:443:${primary_edge}:443" \
              -H 'Cache-Control: no-cache' \
              "https://zhuoqidev.com/deploy-manifest.json?verify=${commit_sha}" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))' \
              2>/dev/null || true)
            san=$(curl --fail --silent --show-error \
              --connect-to "www.zhuoqidev.com:443:${san_edge}:443" \
              -H 'Cache-Control: no-cache' \
              "https://www.zhuoqidev.com/deploy-manifest.json?verify=${commit_sha}" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))' \
              2>/dev/null || true)
            cloudflare=$(curl --fail --silent --show-error \
              -H 'Cache-Control: no-cache' \
              "https://zhuoqidev.pages.dev/deploy-manifest.json?verify=${commit_sha}" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))' \
              2>/dev/null || true)
            if [[ $primary == "$commit_sha" && \
                  $san == "$commit_sha" && \
                  $cloudflare == "$commit_sha" ]]; then
              echo "published and verified $commit_sha on Alibaba Cloud CDN and Cloudflare Pages"
              exit 0
            fi
            if [[ $attempt -lt 36 ]]; then
              sleep 5
            fi
          done
          echo "providers did not all serve $commit_sha within 180 seconds" >&2
          exit 1

      - name: Verify text content types on both providers
        run: |
          check_type() {
            local url=$1 want=$2 got
            got=$(curl --fail --silent --show-error --head "$url" \
              | tr -d '\r' | awk 'tolower($1)=="content-type:" {sub(/^[^:]*: */, ""); print}')
            if [[ ${got,,} != "${want,,}"* ]]; then
              echo "$url answered Content-Type '$got', expected '$want'" >&2
              exit 1
            fi
            echo "$url → $got"
          }
          oss=https://zhuoqidev.oss-cn-shenzhen.aliyuncs.com
          cf=https://zhuoqidev.pages.dev
          for base in "$oss" "$cf"; do
            check_type "$base/llms.txt" "text/plain; charset=utf-8"
            check_type "$base/posts/managed-agents-outcomes-dreaming/index.md" "text/markdown; charset=utf-8"
          done
