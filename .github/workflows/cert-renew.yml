name: Renew CDN certificate

on:
  schedule:
    # Avoid the start-of-hour GitHub Actions load spike.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zhuoqidev-certificate-renewal
  cancel-in-progress: false

jobs:
  renew:
    name: Renew ${{ matrix.name }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: production-certificate
    strategy:
      # One failing certificate must not cancel the others; one at a time keeps
      # the AliDNS challenge records of different runs apart.
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: zhuoqidev.com
            domains: zhuoqidev.com www.zhuoqidev.com
            edges: zhuoqidev.com.queniuaa.com www.zhuoqidev.com.w.kunlunaq.com
          # argus is a separate project, renewed here because this repository
          # stays active and GitHub disables schedules in public repositories
          # after 60 days without commits.
          - name: argus.zhuoqidev.com
            domains: argus.zhuoqidev.com
            edges: argus.zhuoqidev.com.w.kunlunaq.com

    steps:
      - name: Check out trusted default-branch code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Alibaba Cloud CLI
        run: bash scripts/install-aliyun.sh

      - name: Check, renew, publish, and verify certificate
        env:
          ALIYUN_BIN: ${{ runner.temp }}/aliyun-3.5.1/aliyun
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          ACME_ACCOUNT_EMAIL: ${{ secrets.ACME_ACCOUNT_EMAIL }}
          CERT_RENEW_THRESHOLD_DAYS: "30"
          CERT_MIN_NEW_DAYS: "30"
          CERT_DOMAINS: ${{ matrix.domains }}
          CERT_EDGES: ${{ matrix.edges }}
        run: bash scripts/renew-cert.sh
