<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>品牌色块拼贴</title>
    <style>
      /* Layout: a 4-column bento of solid color tiles; each tile states one rule of the brand and lets you play with it. */
      :root {
        --page: #f4f2ee;
        --tile: #ffffff;
        --ink: #1a1918;
        --ink-2: #5d5a55;
        --blue: #0061fe;
        --on-blue: #ffffff;
        --coral: #ff6f4f;
        --lime: #c6f36b;
        --pink: #f7b9d1;
        --yellow: #ffd23f;
        --night: #1a1918;
        --on-night: #f4f2ee;
        --radius: 22px;
        --gap: 12px;
        --f-sans: system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei",
          sans-serif;
        --f-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        --spring: linear(0, 0.062, 0.215, 0.411, 0.615, 0.799, 0.95, 1.059, 1.126, 1.158, 1.161, 1.145, 1.116, 1.083,
            1.051, 1.023, 1.001, 0.986, 0.977, 0.974, 0.974, 0.978, 0.983, 0.988, 0.994, 0.998, 1.001, 1.003, 1.004, 1);
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #121110;
          --tile: #1f1e1c;
          --ink: #f4f2ee;
          --ink-2: #a8a49d;
          --blue: #2f7bff;
          --coral: #f0623f;
          --lime: #b3e05a;
          --pink: #e7a3be;
          --yellow: #f2c62c;
          --night: #2a2826;
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: var(--page);
        color: var(--ink);
        font-family: var(--f-sans);
        font-size: 15px;
        line-height: 1.5;
        padding: clamp(12px, 3vw, 28px);
      }
      button {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 3px;
      }
      .mono {
        font-family: var(--f-mono);
        font-size: 11.5px;
        letter-spacing: 0.04em;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px 20px;
        margin-bottom: 16px;
      }
      header h1 {
        margin: 0;
        font-size: clamp(22px, 3vw, 30px);
        letter-spacing: -0.02em;
        font-weight: 800;
      }
      header p {
        margin: 0;
        color: var(--ink-2);
      }

      .bento {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        grid-auto-rows: minmax(170px, auto);
        gap: var(--gap);
      }
      .tile {
        border-radius: var(--radius);
        padding: 18px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 12px;
        min-width: 0;
        position: relative;
        overflow: hidden;
        transition: transform 0.5s var(--spring);
      }
      .tile:hover {
        transform: translateY(-3px);
      }
      .tile h2 {
        margin: 0;
        font-size: 19px;
        letter-spacing: -0.01em;
        font-weight: 750;
      }
      .tile p {
        margin: 0;
      }
      .tag {
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }

      /* 01 type */
      .t-type {
        grid-column: span 2;
        grid-row: span 2;
        background: var(--blue);
        color: var(--on-blue);
      }
      .t-type .aa {
        font-size: clamp(120px, 18vw, 230px);
        line-height: 0.8;
        letter-spacing: -0.07em;
        font-weight: 800;
        margin: 0;
        transition: font-weight 0.4s, letter-spacing 0.4s;
      }
      .t-type:hover .aa {
        font-weight: 300;
        letter-spacing: -0.03em;
      }
      .t-type p {
        max-width: 34ch;
        font-size: 16px;
      }

      /* 02 easing */
      .t-ease {
        grid-column: span 2;
        background: var(--night);
        color: var(--on-night);
      }
      .lanes {
        display: grid;
        gap: 12px;
      }
      .lane {
        display: grid;
        grid-template-columns: 74px minmax(0, 1fr);
        align-items: center;
        gap: 10px;
      }
      .rail {
        position: relative;
        height: 18px;
      }
      .rail::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        height: 1px;
        background: currentColor;
        opacity: 0.3;
      }
      .rail i {
        position: absolute;
        top: 0;
        left: 0;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--lime);
        transition: left 1.1s var(--e);
      }
      .t-ease.go .rail i {
        left: calc(100% - 18px);
      }
      .replay {
        align-self: flex-start;
        background: none;
        border: 1px solid currentColor;
        border-radius: 999px;
        padding: 5px 12px;
        cursor: pointer;
      }

      /* 03 icon slot machine */
      .t-slot {
        background: var(--coral);
        color: #1a1918;
        cursor: pointer;
        border: 0;
        text-align: left;
        font: inherit;
      }
      .reel {
        height: 64px;
        overflow: hidden;
        font-size: 52px;
        line-height: 64px;
        font-weight: 700;
      }
      .reel span {
        display: block;
        transition: transform 0.9s cubic-bezier(0.2, 0.9, 0.25, 1.15);
      }

      /* 04 radius */
      .t-radius {
        background: var(--lime);
        color: #1a1918;
      }
      .nest {
        --r: 26px;
        --p: 10px;
        border-radius: var(--r);
        padding: var(--p);
        background: rgba(26, 25, 24, 0.12);
      }
      .nest div {
        border-radius: calc(var(--r) - var(--p));
        padding: var(--p);
        background: rgba(26, 25, 24, 0.16);
      }
      .nest div div {
        border-radius: calc(var(--r) - var(--p) * 2);
        height: 34px;
        background: #1a1918;
      }

      /* 05 color system */
      .t-color {
        grid-column: span 2;
        background: var(--tile);
      }
      .chips {
        display: flex;
        gap: 8px;
        height: 64px;
      }
      .chip {
        flex: 1;
        border: 0;
        border-radius: 12px;
        cursor: pointer;
        transition: flex 0.5s var(--spring);
        display: flex;
        align-items: flex-end;
        padding: 6px 8px;
        font-family: var(--f-mono);
        font-size: 10.5px;
        color: transparent;
        min-width: 0;
      }
      .chip[aria-pressed="true"] {
        flex: 3.2;
        color: var(--chip-ink, #1a1918);
      }
      .t-color .hint {
        color: var(--ink-2);
      }

      /* 06 voice */
      .t-voice {
        background: var(--yellow);
        color: #1a1918;
      }
      .voice {
        display: grid;
        gap: 6px;
      }
      .voice s {
        opacity: 0.55;
      }
      .voice b {
        font-size: 17px;
      }

      /* 07 motion timing */
      .t-time {
        background: var(--pink);
        color: #1a1918;
      }
      .bars {
        display: grid;
        gap: 6px;
      }
      .bar {
        display: grid;
        grid-template-columns: 52px minmax(0, 1fr);
        gap: 8px;
        align-items: center;
      }
      .bar i {
        height: 10px;
        border-radius: 6px;
        background: #1a1918;
        width: var(--v);
      }

      @media (max-width: 820px) {
        .bento {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 460px) {
        .bento {
          grid-template-columns: minmax(0, 1fr);
        }
        .t-type,
        .t-ease,
        .t-color {
          grid-column: auto;
          grid-row: auto;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>一块砖，讲一条规范</h1>
      <p class="mono">Brand blocks · 字体 / 缓动 / 图标 / 圆角 / 颜色 / 语气 / 时长</p>
    </header>

    <main class="bento">
      <section class="tile t-type" aria-labelledby="type-h">
        <div class="tag mono"><span>01 · 字体</span><span>悬停看细体</span></div>
        <p class="aa" aria-hidden="true">Aa</p>
        <div>
          <h2 id="type-h">标题粗，正文常规</h2>
          <p>只用两个字重就能分出层次。超大的字母本身就是封面，不用再配插图。</p>
        </div>
      </section>

      <section class="tile t-ease go" id="ease" aria-labelledby="ease-h">
        <div class="tag mono"><span>02 · 缓动</span><span>1.1 s</span></div>
        <h2 id="ease-h">进场快、落地慢</h2>
        <div class="lanes mono">
          <div class="lane"><span>linear</span><div class="rail"><i style="--e: linear"></i></div></div>
          <div class="lane"><span>ease</span><div class="rail"><i style="--e: ease"></i></div></div>
          <div class="lane"><span>品牌曲线</span><div class="rail"><i style="--e: cubic-bezier(0.7, 0, 0.2, 1)"></i></div></div>
        </div>
        <button class="replay mono" type="button" id="replay">再跑一次</button>
      </section>

      <button class="tile t-slot" type="button" id="slot" aria-label="点一下换图标">
        <span class="tag mono"><span>03 · 图标</span><span>点我</span></span>
        <span class="reel" aria-hidden="true"><span id="reel">◐<br />▲<br />✦<br />●<br />◆<br />✚<br />◐</span></span>
        <span><b style="font-size: 17px">一个形状一个意思</b></span>
      </button>

      <section class="tile t-radius" aria-labelledby="radius-h">
        <div class="tag mono"><span>04 · 圆角</span><span>26 / 16 / 6</span></div>
        <div class="nest" aria-hidden="true"><div><div></div></div></div>
        <h2 id="radius-h">里层圆角 = 外层 − 内边距</h2>
      </section>

      <section class="tile t-color" aria-labelledby="color-h">
        <div class="tag mono"><span>05 · 颜色</span><span class="hint">点一块看色值</span></div>
        <h2 id="color-h">一个主色，五个配角</h2>
        <div class="chips" role="group" aria-label="品牌色">
          <button class="chip" type="button" style="background: var(--blue); --chip-ink: #fff" aria-pressed="true">#0061FE</button>
          <button class="chip" type="button" style="background: #1a1918; --chip-ink: #f4f2ee" aria-pressed="false">#1A1918</button>
          <button class="chip" type="button" style="background: var(--coral)" aria-pressed="false">#FF6F4F</button>
          <button class="chip" type="button" style="background: var(--lime)" aria-pressed="false">#C6F36B</button>
          <button class="chip" type="button" style="background: var(--pink)" aria-pressed="false">#F7B9D1</button>
          <button class="chip" type="button" style="background: var(--yellow)" aria-pressed="false">#FFD23F</button>
        </div>
      </section>

      <section class="tile t-voice" aria-labelledby="voice-h">
        <div class="tag mono"><span>06 · 语气</span><span>说人话</span></div>
        <div class="voice">
          <s>您的文件同步操作已成功完成</s>
          <b id="voice-h">文件同步好了</b>
        </div>
      </section>

      <section class="tile t-time" aria-labelledby="time-h">
        <div class="tag mono"><span>07 · 时长</span><span>ms</span></div>
        <div class="bars mono">
          <div class="bar"><span>悬停 120</span><i style="--v: 20%"></i></div>
          <div class="bar"><span>展开 240</span><i style="--v: 40%"></i></div>
          <div class="bar"><span>翻页 480</span><i style="--v: 80%"></i></div>
        </div>
        <h2 id="time-h">越大的东西走得越久</h2>
      </section>
    </main>

    <script>
      (function () {
        var ease = document.getElementById("ease");
        document.getElementById("replay").addEventListener("click", function () {
          ease.classList.remove("go");
          setTimeout(function () {
            ease.classList.add("go");
          }, 400);
        });

        // Slot machine: each click moves the reel one glyph; after the last it jumps back without animating.
        var reel = document.getElementById("reel");
        var n = 0;
        var count = 6;
        document.getElementById("slot").addEventListener("click", function () {
          n += 1;
          reel.style.transform = "translateY(" + n * -64 + "px)";
          if (n === count) {
            setTimeout(function () {
              reel.style.transition = "none";
              reel.style.transform = "translateY(0)";
              n = 0;
              reel.offsetHeight;
              reel.style.transition = "";
            }, 950);
          }
        });

        var chips = document.querySelectorAll(".chip");
        chips.forEach(function (c) {
          c.addEventListener("click", function () {
            chips.forEach(function (o) {
              o.setAttribute("aria-pressed", String(o === c));
            });
          });
        });
      })();
    </script>
  </body>
</html>
