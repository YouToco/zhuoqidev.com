<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>扁平人物插画</title>
    <style>
      /* Layout: a grass-green hero with a huge plain headline and a crowd of flat-drawn people jumping arm in arm
         at the bottom. Scrolling lets the crowd tumble apart while a cream sheet with rounded corners rises over
         it; a paper plane flies its dashed path, and white rounded cards carry the copy. */
      :root {
        --hero: #9dd36f;
        --sheet: #f4f0e4;
        --card: #ffffff;
        --ink: #232323;
        --ink-2: #55524a;
        --coral: #f07a64;
        --blue: #4f8ff7;
        --yellow: #f5d63d;
        --lilac: #c9a8f0;
        --f-sans: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --hero: #2f5524;
          --sheet: #1c1b17;
          --card: #26251f;
          --ink: #f1eee6;
          --ink-2: #b9b4a7;
          color-scheme: dark;
        }
      }
      @property --s {
        syntax: "<number>";
        inherits: true;
        initial-value: 0;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: var(--sheet);
        color: var(--ink);
        font-family: var(--f-sans);
        font-size: 16px;
        line-height: 1.5;
        overflow-x: hidden;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      :focus-visible {
        outline: 3px solid var(--blue);
        outline-offset: 3px;
      }

      .nav {
        position: sticky;
        top: 12px;
        z-index: 20;
        margin: 12px clamp(12px, 2vw, 20px) 0;
        background: var(--card);
        border-radius: 14px;
        padding: 10px 12px 10px 18px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 21px;
        font-weight: 500;
        letter-spacing: -0.02em;
        margin-right: auto;
      }
      .logo i {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 3px solid var(--hero);
        position: relative;
      }
      .logo i::after {
        content: "";
        position: absolute;
        left: 7px;
        top: 4px;
        width: 8px;
        height: 12px;
        border-radius: 8px 8px 2px 8px;
        background: var(--hero);
        rotate: -30deg;
      }
      .quote {
        border: 0;
        background: #efeadb;
        color: #232323;
        border-radius: 8px;
        padding: 9px 14px;
        font-size: 15px;
      }
      .burger {
        width: 40px;
        height: 40px;
        border: 0;
        border-radius: 50%;
        background: var(--hero);
        display: grid;
        place-content: center;
        gap: 5px;
      }
      .burger i {
        width: 16px;
        height: 2px;
        background: #232323;
        border-radius: 2px;
      }

      /* ---------- hero ---------- */
      .hero {
        background: var(--hero);
        margin-top: -74px;
        padding: 110px clamp(16px, 4vw, 40px) 0;
        text-align: center;
        position: relative;
        overflow: hidden;
        view-timeline: --hero block;
      }
      .hero h1 {
        margin: 0;
        font-weight: 500;
        letter-spacing: -0.05em;
        line-height: 0.95;
        font-size: clamp(64px, 12vw, 168px);
        color: #232323;
        text-wrap: balance;
      }
      .hero p {
        margin: 22px 0 0;
        font-size: clamp(18px, 2vw, 24px);
        letter-spacing: -0.02em;
        color: #232323;
      }
      .crowd {
        display: block;
        width: min(100%, 1040px);
        height: auto;
        margin: 10px auto -6px;
        overflow: visible;
      }
      /* Each person bounces on their own beat; on scroll the crowd tumbles apart (--s 0 → 1). */
      @supports (animation-timeline: view()) {
        .hero {
          animation: scatter linear both;
          animation-timeline: --hero;
          animation-range: exit 0% exit 80%;
        }
        @keyframes scatter {
          to {
            --s: 1;
          }
        }
      }
      .who {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        translate: calc(var(--tx) * var(--s)) calc(var(--ty) * var(--s));
        rotate: calc(var(--tr) * var(--s));
      }
      .bob {
        animation: bob var(--b, 1.4s) ease-in-out infinite alternate;
        transform-box: fill-box;
        transform-origin: 50% 100%;
      }
      @keyframes bob {
        from {
          transform: translateY(0) rotate(-1.5deg);
        }
        to {
          transform: translateY(-22px) rotate(1.5deg);
        }
      }
      .wave {
        transform-box: fill-box;
        transform-origin: 0% 100%;
        animation: wave 1.1s ease-in-out infinite alternate;
      }
      @keyframes wave {
        to {
          transform: rotate(-12deg);
        }
      }
      .confetti {
        animation: float 3s ease-in-out infinite alternate;
        transform-box: fill-box;
      }
      @keyframes float {
        to {
          transform: translateY(-14px) rotate(12deg);
        }
      }

      /* ---------- the sheet that rises over the crowd ---------- */
      .sheet {
        position: relative;
        z-index: 2;
        background: var(--sheet);
        margin-top: -70px;
        border-radius: 56px 56px 0 0;
        padding: 64px clamp(16px, 4vw, 40px) 40px;
      }
      .lead {
        max-width: 1100px;
        margin: 0;
        font-weight: 400;
        letter-spacing: -0.03em;
        line-height: 1.2;
        font-size: clamp(26px, 3.6vw, 48px);
      }
      .ask {
        margin-top: 28px;
        display: inline-flex;
        align-items: center;
        gap: 14px;
        background: var(--card);
        color: var(--ink);
        border: 0;
        border-radius: 14px 14px 14px 4px;
        padding: 12px 12px 12px 20px;
        font-size: 17px;
        box-shadow: 0 10px 24px -16px rgba(0, 0, 0, 0.4);
      }
      .ask i {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--hero);
        display: grid;
        place-items: center;
        font-style: normal;
      }

      /* paper plane on a dashed path, flown by scrolling */
      .flight {
        position: relative;
        height: 340px;
        max-width: 1100px;
        margin: 10px auto 0;
        overflow: clip;
      }
      .flight svg:not(.plane) {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .plane {
        position: absolute;
        left: 0;
        top: 0;
        width: 64px;
        height: 64px;
        offset-path: path("M 40 300 C 220 300, 260 80, 460 120 S 760 330, 1040 60");
        offset-distance: 70%;
        offset-rotate: auto;
      }
      @supports (animation-timeline: view()) {
        .flight {
          view-timeline: --flight block;
        }
        .plane {
          animation: fly linear both;
          animation-timeline: --flight;
          animation-range: entry 10% exit 40%;
        }
        @keyframes fly {
          from {
            offset-distance: 0%;
          }
          to {
            offset-distance: 100%;
          }
        }
      }

      .cards {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 18px;
        max-width: 1100px;
        margin: 0 auto;
        padding-bottom: 90px;
      }
      .card {
        background: var(--card);
        border-radius: 18px;
        padding: 30px 28px;
        display: grid;
        gap: 16px;
        align-content: start;
        position: relative;
      }
      .card h2 {
        margin: 0;
        font-weight: 500;
        letter-spacing: -0.04em;
        font-size: clamp(32px, 4vw, 52px);
        line-height: 1;
      }
      .card p {
        margin: 0;
        font-size: 18px;
        line-height: 1.45;
        color: var(--ink-2);
      }
      .go {
        justify-self: start;
        display: inline-flex;
        align-items: center;
        gap: 14px;
        border: 0;
        border-radius: 10px;
        padding: 10px 20px 10px 10px;
        background: var(--coral);
        color: #232323;
        font-size: 17px;
        transition: translate 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .go:hover {
        translate: 0 -3px;
      }
      .go i {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: #fff;
        display: grid;
        place-items: center;
        font-style: normal;
      }
      .card.g {
        background: var(--hero);
        color: #232323;
      }
      .card.g p {
        color: #2f3a24;
      }
      .card.g .go {
        background: #fff;
      }
      .squiggle {
        position: absolute;
        right: 26px;
        top: -26px;
        width: 60px;
        height: 80px;
      }

      @media (max-width: 720px) {
        .cards {
          grid-template-columns: minmax(0, 1fr);
        }
        .quote {
          display: none;
        }
        .flight {
          height: 220px;
        }
        .sheet {
          border-radius: 34px 34px 0 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="nav">
      <span class="logo"><i aria-hidden="true"></i>人话研究所</span>
      <button class="quote" type="button">要一份报价</button>
      <button class="burger" type="button" aria-label="菜单"><i></i><i></i></button>
    </header>

    <section class="hero" aria-labelledby="hero-h">
      <h1 id="hero-h">听见<br />真实的人</h1>
      <p>一个懂当地的全球伙伴</p>

      <svg class="crowd" viewBox="0 0 1000 470" role="img" aria-label="四个手挽手跳起来的人">
        <!-- confetti -->
        <path class="confetti" d="M720 60 q 14 -18 28 0 t 28 0" fill="none" stroke="#f5d63d" stroke-width="10" stroke-linecap="round" />
        <circle class="confetti" cx="120" cy="150" r="8" fill="#4f8ff7" />
        <circle class="confetti" cx="880" cy="130" r="6" fill="#ffffff" />
        <path class="confetti" d="M300 90 l 18 10 l -6 18" fill="none" stroke="#f07a64" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

        <!-- person A: pointing left -->
        <g class="who" style="--tx: -260px; --ty: 160px; --tr: -40deg">
          <g class="bob" style="--b: 1.3s">
            <path d="M150 430 L 170 340" stroke="#e8dcc8" stroke-width="44" stroke-linecap="round" />
            <path d="M215 430 L 205 340" stroke="#e8dcc8" stroke-width="44" stroke-linecap="round" />
            <ellipse cx="140" cy="440" rx="34" ry="16" fill="#ffffff" />
            <ellipse cx="222" cy="440" rx="34" ry="16" fill="#f07a64" />
            <path d="M140 260 q 50 -50 110 0 l 0 90 l -110 0 z" fill="#4f8ff7" />
            <path class="wave" d="M150 280 L 60 300" stroke="#4f8ff7" stroke-width="34" stroke-linecap="round" />
            <circle cx="50" cy="302" r="20" fill="#8a4b2a" />
            <circle cx="195" cy="205" r="44" fill="#8a4b2a" />
            <path d="M152 196 q 10 -52 64 -44 q 40 10 26 46 q -30 -26 -90 -2 z" fill="#1d1d1d" />
            <circle cx="232" cy="150" r="16" fill="#1d1d1d" />
            <path d="M176 214 q 8 8 16 0 M 202 214 q 8 8 16 0" fill="none" stroke="#1d1d1d" stroke-width="4" stroke-linecap="round" />
            <path d="M184 232 q 12 10 24 0" fill="none" stroke="#1d1d1d" stroke-width="4" stroke-linecap="round" />
          </g>
        </g>

        <!-- person B: eyes closed, coral shirt with a flower -->
        <g class="who" style="--tx: -80px; --ty: 220px; --tr: -18deg">
          <g class="bob" style="--b: 1.6s">
            <path d="M350 430 L 360 350" stroke="#f5d63d" stroke-width="52" stroke-linecap="round" />
            <path d="M425 430 L 410 350" stroke="#f5d63d" stroke-width="52" stroke-linecap="round" />
            <ellipse cx="340" cy="442" rx="38" ry="17" fill="#1d1d1d" />
            <ellipse cx="434" cy="442" rx="38" ry="17" fill="#c9a8f0" />
            <path d="M325 270 q 60 -50 120 0 l 6 96 l -132 0 z" fill="#f07a64" />
            <g fill="#ffffff">
              <circle cx="388" cy="300" r="9" /><circle cx="400" cy="310" r="9" /><circle cx="376" cy="310" r="9" /><circle cx="382" cy="324" r="9" /><circle cx="396" cy="324" r="9" />
            </g>
            <circle cx="389" cy="314" r="6" fill="#f5d63d" />
            <path d="M330 290 L 250 330" stroke="#f07a64" stroke-width="32" stroke-linecap="round" />
            <circle cx="384" cy="210" r="48" fill="#f6c7a8" />
            <path d="M336 200 q -6 -60 52 -60 q 60 0 50 56 q -18 -30 -50 -34 q -30 6 -52 38 z" fill="#1d1d1d" />
            <path d="M330 160 q -40 -10 -36 -40 q 30 4 44 26 z" fill="#1d1d1d" />
            <path d="M364 214 q 8 -6 16 0 M 392 214 q 8 -6 16 0" fill="none" stroke="#1d1d1d" stroke-width="4" stroke-linecap="round" />
            <ellipse cx="386" cy="236" rx="9" ry="5" fill="#d3604c" />
          </g>
        </g>

        <!-- person C: headband, arm up pointing -->
        <g class="who" style="--tx: 90px; --ty: 240px; --tr: 22deg">
          <g class="bob" style="--b: 1.2s">
            <path d="M555 430 L 560 340" stroke="#f07a64" stroke-width="54" stroke-linecap="round" />
            <path d="M630 430 L 618 340" stroke="#f07a64" stroke-width="54" stroke-linecap="round" />
            <ellipse cx="546" cy="442" rx="38" ry="17" fill="#ffffff" />
            <ellipse cx="640" cy="442" rx="38" ry="17" fill="#1d1d1d" />
            <path d="M530 262 q 60 -54 126 0 l 6 100 l -138 0 z" fill="#c9a8f0" />
            <rect x="575" y="300" width="22" height="26" rx="4" fill="#ffffff" />
            <path class="wave" d="M640 270 L 740 190" stroke="#c9a8f0" stroke-width="34" stroke-linecap="round" />
            <path d="M728 172 q 34 -30 56 -18 q 8 14 -20 24 q 22 2 20 16 q -10 12 -40 6 z" fill="#f6c7a8" />
            <path d="M540 290 L 470 320" stroke="#c9a8f0" stroke-width="32" stroke-linecap="round" />
            <circle cx="594" cy="200" r="48" fill="#f2b48f" />
            <path d="M546 186 q 0 -52 50 -54 q 48 2 46 52 z" fill="#5a3a22" />
            <path d="M544 186 q 50 -24 100 0" fill="none" stroke="#f5d63d" stroke-width="12" stroke-linecap="round" />
            <path d="M572 206 q 8 8 16 0 M 600 206 q 8 8 16 0" fill="none" stroke="#1d1d1d" stroke-width="4" stroke-linecap="round" />
            <path d="M578 224 q 16 22 32 0 z" fill="#1d1d1d" />
          </g>
        </g>

        <!-- person D: rainbow trousers -->
        <g class="who" style="--tx: 260px; --ty: 180px; --tr: 38deg">
          <g class="bob" style="--b: 1.5s">
            <path d="M770 430 L 778 340" stroke="#4f8ff7" stroke-width="56" stroke-linecap="round" />
            <path d="M850 430 L 836 340" stroke="#4f8ff7" stroke-width="56" stroke-linecap="round" />
            <path d="M770 420 L 778 350" stroke="#f5d63d" stroke-width="8" stroke-linecap="round" />
            <path d="M850 420 L 836 350" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
            <ellipse cx="760" cy="442" rx="38" ry="17" fill="#f07a64" />
            <ellipse cx="860" cy="442" rx="38" ry="17" fill="#ffffff" />
            <path d="M750 266 q 60 -52 122 0 l 6 98 l -134 0 z" fill="#f5d63d" />
            <path d="M760 286 L 690 310" stroke="#f5d63d" stroke-width="32" stroke-linecap="round" />
            <path class="wave" d="M866 284 L 940 230" stroke="#f5d63d" stroke-width="32" stroke-linecap="round" />
            <circle cx="948" cy="222" r="19" fill="#5b3a29" />
            <circle cx="812" cy="204" r="46" fill="#5b3a29" />
            <path d="M766 196 q 6 -54 48 -52 q 44 0 44 50 q -10 -18 -44 -22 q -32 4 -48 24 z" fill="#1d1d1d" />
            <path d="M792 210 q 8 8 16 0 M 818 210 q 8 8 16 0" fill="none" stroke="#f6e7d8" stroke-width="4" stroke-linecap="round" />
            <path d="M798 228 q 14 12 28 0" fill="none" stroke="#f6e7d8" stroke-width="4" stroke-linecap="round" />
          </g>
        </g>
      </svg>
    </section>

    <section class="sheet" aria-label="我们是谁">
      <p class="lead">
        我们在拉各斯、首尔、伦敦，和真正懂当地的人坐下来聊天，把表格里看不到的东西带回来，帮你更快、更有底气地做决定。
      </p>
      <button class="ask" type="button">要一份报价 <i aria-hidden="true">↗</i></button>

      <div class="flight" aria-hidden="true">
        <svg viewBox="0 0 1100 340" preserveAspectRatio="none">
          <path d="M 40 300 C 220 300, 260 80, 460 120 S 760 330, 1040 60" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round" opacity=".5" />
        </svg>
        <svg class="plane" viewBox="0 0 64 64">
          <path d="M4 30 L 60 8 L 40 56 L 30 36 z" fill="#ffffff" stroke="#232323" stroke-width="2.4" stroke-linejoin="round" />
          <path d="M30 36 L 60 8" stroke="#232323" stroke-width="2.4" />
        </svg>
      </div>

      <div class="cards">
        <article class="card">
          <svg class="squiggle" viewBox="0 0 60 80" aria-hidden="true">
            <path d="M18 6 q 26 10 4 24 q -22 14 6 26 q 22 10 4 22" fill="none" stroke="#f5d63d" stroke-width="12" stroke-linecap="round" />
          </svg>
          <h2>不再一团乱。</h2>
          <p>好几家供应商、好几个时区、好几种语言，加起来就乱了。我们把这些都放在一个屋檐下，从头到尾一起做。</p>
          <button class="go" type="button"><i aria-hidden="true">›</i>看服务</button>
        </article>
        <article class="card g">
          <h2>28 个人，3 个城市。</h2>
          <p>每一场访谈都由当地的研究员来聊，不是翻译过来的问卷。</p>
          <button class="go" type="button"><i aria-hidden="true">›</i>读访谈</button>
        </article>
      </div>
    </section>
  </body>
</html>
